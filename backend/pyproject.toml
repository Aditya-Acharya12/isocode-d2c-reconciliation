[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"] # FastAPI's Depends() in defaults is the framework's idiom

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations, and isn't the alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
# These build SQL only from fixed table names and fixed conditions. Every value is bound.
"app/services/reconciliation/runner.py" = ["S608"]
"app/api/routes/reconciliation.py" = ["S608", "E501"]
"scripts/**" = ["S105", "S106"]
