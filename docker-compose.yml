# Local development database only. The API and frontend run natively so that
# reloads stay fast on Windows.
# The fixed name keeps the same data volume wherever the repository folder lives.
name: isocode-d2c-reconciliation

services:
  postgres:
    image: postgres:16-alpine
    container_name: recon-postgres
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon_local_only
      POSTGRES_DB: recon
    ports:
      - "5433:5432"
    volumes:
      - recon-pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  recon-pgdata:
